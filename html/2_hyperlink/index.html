<!DOCTYPE html>
<html>
<head>
    <title>HyperLink</title>
</head>
<body>

    <!--An atrribute such as href is typically a name value pair that modifies the behavior of an element -->
    <!-- target="_blank" Opens the linked page in a new browser tab -->
    <!--title Displays this text as a tooltip when you hover over the element -->

    <!--Absolute URL-->
    <a href="https://www.google.com/" target="_blank" title="Takes you to google">
        click me
    </a>

    <br>

    <!--Relative URL-->
    <a href="lyrics.html">
        song lyrics
    </a>

    <br>

    <a href="mailto:test@fake.com" target="_blank">
        email me
    </a>
</body>
</html>
